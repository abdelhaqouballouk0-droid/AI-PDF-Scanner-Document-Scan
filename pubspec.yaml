name: ai_pdf_scanner
description: "AI PDF Scanner - Document Scan: scan, convert, edit, sign and chat with your documents."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Document scanning (native edge-detection scanner: ML Kit on Android, VisionKit on iOS)
  cunning_document_scanner: ^1.3.0

  # PDF manipulation (merge / split / rotate / delete pages / encrypt / decrypt / text extraction)
  syncfusion_flutter_pdf: ^34.2.8

  # PDF viewing + in-app annotation (highlight, underline, free-form ink, form fill)
  syncfusion_flutter_pdfviewer: ^34.2.8
  syncfusion_flutter_core: ^34.2.8

  # Create PDFs from images / render pages
  pdf: ^3.11.1
  printing: ^5.13.1

  # On-device OCR (Image to Text)
  google_mlkit_text_recognition: ^0.13.1

  # Signature drawing pad
  signature: ^5.5.0

  # File system helpers
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^13.1.0
  open_filex: ^4.5.0
  share_plus: ^13.0.0

  # Permissions (camera, photos, storage)
  permission_handler: ^12.0.1

  # Local key-value storage (settings, API keys, recents index)
  shared_preferences: ^2.3.2

  # Networking (AI assistant + optional Office<->PDF conversion backend)
  http: ^1.2.2

  # Utilities
  intl: ^0.20.3
  uuid: ^4.5.1
  image: ^4.3.0
  package_info_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
