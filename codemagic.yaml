workflows:
  android-workflow:
    name: Android (APK + AAB)
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      # Create this group in Codemagic (Teams > your team > Environment
      # variable groups) only if you want a real Play Store-signed release.
      # Variables expected inside it: CM_KEYSTORE (base64-encoded .jks),
      # CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD.
      # Without this group, the release build falls back to debug signing
      # (fine for internal testing, not for the Play Store).
      groups:
        - android_keystore
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Flutter analyze
        script: flutter analyze

      - name: Flutter unit tests
        script: flutter test

      - name: Set up release signing (optional)
        script: |
          if [ -n "${CM_KEYSTORE:-}" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/app/release-keystore.jks"
            cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=release-keystore.jks
          EOF
            echo "Release keystore configured — building a Play Store-signed AAB/APK."
          else
            echo "CM_KEYSTORE not set — release build will use debug signing (fine for QA, not for the Play Store)."
          fi

      - name: Build APK (for direct install / QA distribution)
        script: flutter build apk --release

      - name: Build App Bundle (for Play Store upload)
        script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/**/*.aab
      - build/app/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - ayoubboutglay318@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment once you've connected a Google Play service account in
      # Codemagic (Teams > Integrations > Google Play):
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true

  ios-workflow:
    name: iOS (IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # Group holding CERTIFICATE_PRIVATE_KEY_B64 — a 2048-bit RSA key
      # (secret), base64-encoded to a single line so Codemagic's
      # multiline-secret handling can't mangle it. Add it in the app's
      # Environment variables tab, group "ios_signing". The "Fetch
      # signing files" script decodes it back to PEM and hands it to
      # fetch-signing-files --create as a file, which uses it to build
      # the new distribution certificate's CSR; without it, there's no
      # key to attach to the certificate it creates ("Cannot save
      # Signing Certificates without certificate private key").
      # Generate one with: openssl genrsa 2048 | base64 -w0
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.ouballouk.aipdfscanner"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      # Requires an Apple Developer Portal / App Store Connect API key
      # connected in Codemagic (Teams > Integrations > Developer Portal),
      # with access to the com.ouballouk.aipdfscanner bundle ID (must
      # already be registered as an App ID in the Developer Portal AND
      # as an app in App Store Connect — fetch-signing-files --create
      # only creates the certificate/profile, not the App ID/app
      # itself). The integration name below ("Codemagic") must match
      # the key's name exactly as shown in that integration's
      # "Manage keys" dialog.
    integrations:
      app_store_connect: Codemagic
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Flutter analyze
        script: flutter analyze

      - name: Initialize keychain
        script: keychain initialize

      - name: Fetch signing files
        script: |
          echo "$CERTIFICATE_PRIVATE_KEY_B64" | base64 --decode > "$CM_BUILD_DIR/cert_key.pem"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "$(cat "$CM_BUILD_DIR/cert_key.pem")" \
            --create

      - name: Set up code signing (App Store Connect)
        script: xcode-project use-profiles

      - name: Install CocoaPods dependencies (if any plugin still needs them)
        script: find . -name "Podfile" -execdir pod install \; || true

      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - ayoubboutglay318@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment once App Store Connect publishing should happen automatically:
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
